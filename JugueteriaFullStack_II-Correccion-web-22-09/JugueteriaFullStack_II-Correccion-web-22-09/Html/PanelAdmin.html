<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel & Toys - Panel de Administración</title>
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../Css/Estilos.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- HEADER -->
  <header class="py-2" style="background-color: #81c8e4;">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-4">
        <a href="PaginaPrincipal.html">
          <img src="../Img/LogoPixelToysII.png" alt="Pixel & Toys" style="height: 45px;">
        </a>
        <span class="badge bg-dark fs-6">Panel de Administración</span>
        <ul class="navbar-nav . navbar-link-text-dark d-flex flex-row gap-4">
          <li class="nav-item">
            <a class="nav-link fw-bold" href="../Html/Dashboard.html">
              Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-bold" href="../Html/UsuariosDashboard.html">
              Usuarios
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-bold" href="../Html/PedidosDashboard.html">
              Pedidos
            </a>
          </li>
          
          
        </ul>
      </div>
      <div>
        <a href="PaginaPrincipal.html" class="btn btn-outline-dark btn-sm fw-bold">
          <i class="bi bi-house-door me-1"></i> Volver a la Tienda
        </a>
      </div>
      
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container my-5 flex-grow-1">
    <div class="row g-4">

      <!-- FORMULARIO DE PRODUCTOS (Crear / Editar) -->
      <div class="col-12 col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-3">
          <h4 class="fw-bold mb-3 text-dark" id="formTitulo">Agregar Producto</h4>
          <form id="formProducto">
            <input type="hidden" id="productoId">

            <div class="mb-3">
              <label for="nombreProducto" class="form-label small fw-semibold">Nombre del producto</label>
              <input type="text" class="form-control" id="nombreProducto" required placeholder="Ej: Robot de Madera">
            </div>

            <div class="mb-3">
              <label for="precioProducto" class="form-label small fw-semibold">Precio ($)</label>
              <input type="number" class="form-control" id="precioProducto" required placeholder="Ej: 15990">
            </div>

            <div class="mb-3">
              <label for="imagenProducto" class="form-label small fw-semibold">Nombre de imagen (en Img/)</label>
              <input type="text" class="form-control" id="imagenProducto" required placeholder="Ej: RobotMadera.jpg">
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary fw-semibold" id="btnGuardar">Guardar Producto</button>
              <button type="button" class="btn btn-secondary fw-semibold d-none" id="btnCancelar">Cancelar
                Edición</button>
            </div>
          </form>
        </div>
      </div>

      <!-- TABLA DE PRODUCTOS EN EXISTENCIA -->
      <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 p-3 overflow-hidden">
          <h4 class="fw-bold mb-3 text-dark">Inventario de Productos</h4>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th>Imagen</th>
                  <th>Nombre</th>
                  <th>Precio</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaProductos">
                <!-- Se puebla dinámicamente desde JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white py-4 mt-auto w-100">
    <div class="container text-center">
      <p class="mb-0 small">&copy; 2026 Pixel & Toys. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JavaScript/PanelAdmin.js"></script>
</body>

</html>
