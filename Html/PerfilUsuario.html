<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Juguetería Chile</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../Css/Estilos.css">
</head>
<body class="bg-light">

  <!-- NAVBAR / HEADER -->
  <nav class="navbar navbar-expand-lg navbar-light bg-info bg-opacity-50 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="PaginaPrincipal.html">
        <img src="../Img/Logo_Web.png" alt="Logo" width="40" height="40" class="d-inline-block align-text-top me-2">
        Juguetería Chile
      </a>
      <a href="PaginaPrincipal.html" class="btn btn-outline-dark btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Volver a la Tienda
      </a>
    </div>
  </nav>

  <!-- CONTENIDO DE PERFIL -->
  <div class="container my-5">
    <div class="row g-4">

      <!-- COLUMNA IZQUIERDA: Tarjeta de Presentación y Acciones -->
      <div class="col-12 col-md-4">
        <div class="card shadow-sm border-0 text-center p-4">
          <div class="mb-3">
            <i class="bi bi-person-circle display-1 text-secondary"></i>
          </div>
          <h4 id="perfilNombreHeader" class="fw-bold mb-1">Cargando...</h4>
          <p id="perfilEmailHeader" class="text-muted small">cargando@correo.com</p>
          <hr>

        </div>
      </div>

      <!-- COLUMNA DERECHA: Pestañas (Datos Personales / Historial de Compras) -->
      <div class="col-12 col-md-8">
        <div class="card shadow-sm border-0 p-4">

          <ul class="nav nav-tabs mb-4" id="perfilTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-semibold" id="datos-tab" data-bs-toggle="tab" data-bs-target="#datos" type="button" role="tab">
                <i class="bi bi-person-lines-fill me-1"></i> Datos Personales
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-semibold" id="pedidos-tab" data-bs-toggle="tab" data-bs-target="#pedidos" type="button" role="tab">
                <i class="bi bi-bag-check me-1"></i> Historial de Compras
              </button>
            </li>
          </ul>

          <div class="tab-content" id="perfilTabsContent">

            <!-- TAB 1: DATOS PERSONALES -->
            <div class="tab-pane fade show active" id="datos" role="tabpanel">
              <form id="formEditarPerfil">
                <div class="mb-3">
                  <label for="inputNombrePerfil" class="form-label fw-bold">Nombre Completo</label>
                  <input type="text" class="form-control" id="inputNombrePerfil" required>
                </div>
                <div class="mb-3">
                  <label for="inputEmailPerfil" class="form-label fw-bold">Correo Electrónico</label>
                  <input type="email" class="form-control" id="inputEmailPerfil" disabled readonly>
                  <div class="form-text">El correo no se puede cambiar directamente.</div>
                </div>
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-save me-1"></i> Guardar Cambios
                </button>
              </form>
            </div>

            <!-- TAB 2: HISTORIAL DE COMPRAS -->
            <div class="tab-pane fade" id="pedidos" role="tabpanel">
              <h5 class="fw-bold mb-3">Tus Pedidos Realizados</h5>
              <div id="contenedorHistorialPedidos">
                <!-- Se llena dinámicamente mediante JS -->
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JavaScript/PerfilUsuario.js"></script>
</body>
</html>
