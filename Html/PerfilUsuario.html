<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel & Toys - Perfil de Usuario</title>
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../Css/Estilos.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- HEADER / NAVBAR -->
  <header class="py-2" style="background-color: #81c8e4;">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-4">
        <a href="PaginaPrincipal.html">
          <img src="../Img/LogoPixelToysII.png" alt="Pixel & Toys" style="height: 45px;">
        </a>
        <nav class="d-none d-md-flex align-items-center gap-3 fw-bold text-uppercase small">
          <a href="PaginaPrincipal.html" class="nav-link text-dark">Inicio</a>
          <a href="Categorias.html" class="nav-link text-dark">Categorías</a>
          <a href="Novedades.html" class="nav-link text-dark">Novedades</a>
          <a href="Ofertas.html" class="nav-link text-dark">Ofertas</a>
        </nav>
      </div>

      <!-- Usuario y Carrito -->
      <div class="d-flex align-items-center gap-3">
        <div class="position-relative">
          <button id="iconoPerfil" class="btn border-0 bg-transparent p-0 d-flex align-items-center gap-2"
            type="button">
            <img src="../Img/LogoPixelToysIII.png" alt="Usuario" style="height: 30px;">
            <span id="textoLogin" class="fw-semibold text-dark">Mi Perfil</span>
          </button>

          <div id="menuUsuario" class="card shadow p-2 position-absolute end-0 mt-2 d-none"
            style="width: 180px; z-index: 1000;">
            <p id="nombreUsuarioMenu" class="fw-bold mb-1 text-center small text-truncate"></p>
            <hr class="my-1">
            <button id="btnCerrarSesion" class="btn btn-sm btn-danger text-start w-100">
              <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
            </button>
          </div>
        </div>

        <button id="btnCarrito" class="btn border-0 bg-transparent position-relative p-0" type="button"
          data-bs-toggle="modal" data-bs-target="#modalCarrito">
          <i class="bi bi-bag-fill fs-3 text-dark"></i>
          <span id="contadorCarrito"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO DEL PERFIL -->
  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
          <div class="card-header bg-dark text-white text-center py-4">
            <div class="mb-2">
              <i class="bi bi-person-circle display-4"></i>
            </div>
            <h3 class="fw-bold mb-0" id="perfilNombreHeader">Cargando...</h3>
            <span class="badge bg-primary mt-2" id="perfilRol">Cliente</span>
          </div>

          <div class="card-body p-4">
            <h5 class="fw-bold mb-3 text-secondary border-bottom pb-2">Información Personal</h5>

            <div class="mb-3">
              <label class="form-label text-muted small fw-semibold">Nombre de usuario</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="inputUsuario" class="form-control" readonly>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted small fw-semibold">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="inputCorreo" class="form-control" readonly>
              </div>
            </div>

            <div class="d-grid gap-2 mt-4">
              <a href="PaginaPrincipal.html" class="btn btn-outline-secondary fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Volver a la Tienda
              </a>
              <button id="btnCerrarSesionPerfil" class="btn btn-danger fw-semibold">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>


  <!-- Sección Métodos de Pago -->
  <hr class="my-4 text-muted">
  <h5 class="fw-bold text-dark mb-3">Método de Pago Asociado</h5>

  <div class="mb-3">
    <label for="selectMetodoPago" class="form-label small fw-semibold text-secondary">Selecciona tu método
      preferido</label>
    <div class="input-group">
      <span class="input-group-text bg-white"><i class="bi bi-credit-card"></i></span>
      <select id="selectMetodoPago" class="form-select">
        <option value="" disabled selected>-- Seleccionar método --</option>
        <option value="Tarjeta de Crédito / Débito">Tarjeta de Crédito / Débito</option>
        <option value="Billetera Digital (Mercado Pago / MACH)">Billetera Digital (Mercado Pago / MACH)</option>
        <option value="Transferencia Bancaria">Transferencia Bancaria</option>
      </select>
    </div>
  </div>

  <button type="button" class="btn btn-primary w-100 mb-3 rounded-3 fw-semibold" onclick="guardarMetodoPago()">
    <i class="bi bi-save me-1"></i> Guardar Método de Pago
  </button>

  <div id="alertaPago" class="alert alert-success d-none py-2 small text-center" role="alert">
    ¡Método de pago guardado correctamente!
  </div>

  <!-- FOOTER -->
  <footer class="bg-dark text-white py-4 mt-auto w-100">
    <div class="container text-center">
      <p class="mb-0 small">&copy; 2026 Pixel & Toys. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JavaScript/MenuDesplegable.js"></script>
  <script src="../JavaScript/Carrito.js"></script>
  <script src="../JavaScript/PerfilUsuario.js"></script>
</body>

</html>
