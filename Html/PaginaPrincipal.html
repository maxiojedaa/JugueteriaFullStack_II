<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugueteria Chile</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="../Css/Estilos.css">
</head>

<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg colorBarra px-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">

      <!-- Navegación -->
      <div class="d-flex flex-wrap gap-3">
        <a class="nav-link fw-bold text-dark" href="Categorias.html">CATEGORIAS ▾</a>
        <a class="nav-link fw-bold text-dark" href="Novedades.html">NOVEDADES</a>
        <a class="nav-link fw-bold text-dark" href="Ofertas.html">OFERTAS</a>
        <a class="nav-link fw-bold text-dark" href="Noticias.html">NOTICIAS</a>
      </div>

      <!-- Iconos (Usuario y Carrito) -->
      <div class="d-flex align-items-center gap-3">

        <!-- Perfil Usuario -->
        <div class="position-relative">
          <i id="iconoPerfil" class="bi bi-person text-dark fs-4" style="cursor: pointer;" title="Mi Cuenta"></i>

          <div id="menuUsuario" class="card shadow p-2 position-absolute end-0 mt-2 d-none"
            style="width: 180px; z-index: 1000;">
            <p id="nombreUsuarioMenu" class="fw-bold mb-1 text-center small text-truncate"></p>
            <hr class="my-1">
            <button id="btnVerPerfil" class="btn btn-sm btn-light text-start w-100 mb-1">Ver Perfil</button>
            <button id="btnCerrarSesion" class="btn btn-sm btn-danger text-start w-100">Cerrar Sesión</button>
          </div>
        </div>

        <!-- Botón Abrir Carrito (HU-11) -->
        <button class="btn p-0 border-0 text-dark fs-4" data-bs-toggle="modal" data-bs-target="#modalCarrito"
          onclick="renderizarCarritoModal()" title="Ver Carrito">
          <i class="bi bi-bag"></i>
        </button>

      </div>

    </div>
  </nav>

  <!-- CARRUSEL -->
  <div class="container my-4">
    <div id="carruselProductos" class="carousel slide mx-auto" data-bs-ride="carousel" style="max-width: 500px;">

      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carruselProductos" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carruselProductos" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carruselProductos" data-bs-slide-to="2"></button>
      </div>

      <div class="carousel-inner rounded shadow">
        <div class="carousel-item active" data-bs-interval="3000">
          <a href="DetalleProducto.html?id=1">
            <a href="DetalleProducto.html?id=1">
              <img src="../Img/Pinta tu juguete 1.jpe" class="card-img-top" style="height: 200px; object-fit: cover;"
                alt="Pinta tu juguete">
            </a>
          </a>
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
            <a href="DetalleProducto.html?id=1" class="text-decoration-none text-dark">

              <a href="DetalleProducto.html?id=1" class="text-decoration-none text-white">
                <h5 class="card-title fw-bold">Pinta tu Juguete</h5>
              </a>

            </a>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="3000">
          <img src="../Img/Robot madera 1.jpe" class="d-block w-100 img-carrusel" alt="Robot madera 1">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
            <h5>Robot de Madera</h5>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="3000">
          <img src="../Img/Pinta tu juguete 2.jpg" class="d-block w-100 img-carrusel" alt="Pinta tu juguete 2">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
            <h5>Colección Creativa</h5>
          </div>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carruselProductos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carruselProductos" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>
  </div>

  <!-- CATÁLOGO RÁPIDO DE PRODUCTOS (HU-9 y HU-16) -->
  <div class="container my-5">
    <h3 class="text-center fw-bold mb-4">Productos Destacados</h3>
    <div class="row g-4">

      <!-- Producto 1 -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">

          <a href="DetalleProducto.html?id=1">
            <img src="../Img/Pinta tu juguete 1.jpe" class="card-img-top" style="height: 200px; object-fit: cover;"
              alt="Pinta tu juguete">
          </a>

          <div class="card-body d-flex flex-column justify-content-between">
            <div>

              <a href="DetalleProducto.html?id=1" class="text-decoration-none text-dark">

                <h5 class="card-title fw-bold">
                  Pinta tu Juguete
                </h5>

              </a>

              <p class="card-text text-muted">$12.990</p>

            </div>

            <button class="btn btn-primary w-100 mt-2" onclick="agregarAlCarrito(1)">

              <i class="bi bi-cart-plus me-1"></i>
              Agregar al Carrito

            </button>

          </div>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <a href="DetalleProducto.html?id=2">
            <img src="../Img/Robot madera 1.jpe" class="card-img-top" style="height: 200px; object-fit: cover;"
              alt="Robot de Madera">
          </a>
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <a href="DetalleProducto.html" class="text-decoration-none text-dark">
                <h5 class="card-title fw-bold">Robot de Madera</h5>
              </a>
              <p class="card-text text-muted">$15.990</p>
            </div>
            <button class="btn btn-primary w-100 mt-2" onclick="agregarAlCarrito(2)">
              <i class="bi bi-cart-plus me-1"></i> Agregar al Carrito
            </button>
          </div>
        </div>
      </div>

      <!-- Producto 3 -->
      <!-- Producto 3 -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">

          <a href="DetalleProducto.html?id=3">
            <img src="../Img/Pinta tu juguete 2.jpg" class="card-img-top" style="height: 200px; object-fit: cover;"
              alt="Colección Creativa">
          </a>

          <div class="card-body d-flex flex-column justify-content-between">
            <div>

              <a href="DetalleProducto.html?id=3" class="text-decoration-none text-dark">
                <h5 class="card-title fw-bold">Colección Creativa</h5>
              </a>

              <p class="card-text text-muted">$19.990</p>
            </div>

            <button class="btn btn-primary w-100 mt-2" onclick="agregarAlCarrito(3)">
              <i class="bi bi-cart-plus me-1"></i> Agregar al Carrito
            </button>

          </div>
        </div>
      </div>

      <!-- MODAL CARRITO DE COMPRAS (HU-10, HU-11, HU-12, HU-13, HU-14) -->
      <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">

            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="modalCarritoLabel">
                <i class="bi bi-cart3 me-2"></i>Tu Carrito de Compras
              </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
              <div id="listaCarrito"></div>
            </div>

            <div class="modal-footer d-flex justify-content-between align-items-center">
              <div>
                <span class="fw-bold">Total:</span>
                <span id="totalCarrito" class="fs-5 fw-bold text-success ms-1">$0</span>
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-outline-danger btn-sm" onclick="vaciarCarrito()">Vaciar</button>
                <button class="btn btn-success btn-sm">Finalizar Compra</button>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- SCRIPTS -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
      <script src="../JavaScript/MenuDesplegable.js"></script>
      <script src="../JavaScript/Carrito.js"></script>
</body>

</html>
