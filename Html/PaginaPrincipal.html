<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugueteria Chile</title>

  <!--Importar Bootstrap para que las clases 'navbar' funcionen -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!--Importar iconos (para usuario y carrito) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Importo los el css para las clases de este mismo -->
  <link rel="stylesheet" href="../Css/Estilos.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg colorBarra px-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <!-- Letras de la barra -->
      <div class="d-flex flex-wrap gap-3">
        <a class="nav-link fw-bold text-dark" href="#">CATEGORIAS ▾</a>
        <a class="nav-link fw-bold text-dark" href="#">NOVEDADES</a>
        <a class="nav-link fw-bold text-dark" href="#">OFERTAS</a>
        <a class="nav-link fw-bold text-dark" href="#">NOTICIAS</a>
      </div>

      <!-- Iconos al final (Usuario y Carrito) -->
      <div class="d-flex align-items-center gap-3">
        <!-- Icono de Usuario con enlace -->
        <a href="Usuario.html" class="text-dark fs-4" title="Mi Cuenta">
        <i class="bi bi-person"></i>
        </a>
        
        <a href="#" class="text-dark fs-4" title="Carrito"><i class="bi bi-bag"></i></a>
      </div>

    </div>
  </nav>

  <div class="container my-4">
      <div id="carruselProductos" class="carousel slide mx-auto" data-bs-ride="carousel" style="max-width: 500px;">
        
        <!-- Indicadores (las rayitas de abajo) -->
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carruselProductos" data-bs-slide-to="0" class="active"></button>
          <button type="button" data-bs-target="#carruselProductos" data-bs-slide-to="1"></button>
          <button type="button" data-bs-target="#carruselProductos" data-bs-slide-to="2"></button>
        </div>

        <!-- Imágenes del carrusel -->
        <div class="carousel-inner rounded shadow">
          
          <div class="carousel-item active" data-bs-interval="3000">
            <img src="../Img/Pinta tu juguete 1.jpe" class="d-block w-100 img-carrusel" alt="Pinta tu juguete 1">
            <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
              <h5>Pinta tu Juguete</h5>
            </div>
          </div>

          <div class="carousel-item" data-bs-interval="3000">
            <img src="../Img/Robot madera 1.jpe" class="d-block w-100 img-carrusel" alt="Robot madera 1">
            <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
              <h5>Robot de Madera</h5>
            </div>
          </div>

          <div class="carousel-item" data-bs-interval="3000">
            <img src="../Img/Pinta tu juguete 2.jpg" class="d-block w-100 img-carrusel" alt="Pinta tu juguete 2">
            <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
              <h5>Colección Creativa</h5>
            </div>
          </div>

        </div>

        <!-- Botones Anterior / Siguiente -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carruselProductos" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carruselProductos" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>

      </div>
  </div>

  <!-- Asegúrate de incluir la librería de Bootstrap JS al final del body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
