<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Usuario</title>
    <!-- Estilos personalizados y Bootstrap -->
    <link rel="stylesheet" href="../Css/Estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-secondary d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow rounded" style="width: 400px;">
        <form id="formLogin">
            <h1 class="text-center fw-bold mb-4">LOGIN</h1>

            <div class="mb-3">
                <label for="emailLogin" class="form-label">Ingrese su email:</label>
                <input type="email" class="form-control" id="emailLogin" placeholder="Enter email" name="email"
                    required>
            </div>

            <div class="mb-3">
                <label for="pwdLogin" class="form-label">Password:</label>
                <input type="password" class="form-control" id="pwdLogin" placeholder="Enter password" name="pswd"
                    required>
            </div>

            <div class="form-check mb-3">
                <label class="form-check-label">
                    <input class="form-check-input" type="checkbox" name="remember"> Remember me
                </label>
            </div>

            <button type="submit" class="botonCuenta w-100">Submit</button>

            <div class="text-center mt-4">
                <small class="text-muted">¿No tienes una cuenta? Crea una presionando aquí</small>
                <div class="my-2">▾</div>
                <a class="botonCuenta text-decoration-none d-inline-block w-100 text-center"
                    href="CreacionUsuario.html">Crear Cuenta</a>
            </div>
        </form>
    </div>

    <!-- Contenedor para Toast Emergente en Login -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    <!-- Mensaje dinámico -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Script JavaScript (Ruta corregida con V mayúscula) -->
    <script src="../JavaScript/ValidarLogin.js"></script>
    
    <!-- Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
