<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Usuario</title>
    <!-- Importo los el css para las clases de este mismo -->
  <link rel="stylesheet" href="../Css/Estilos.css">
  <!--Importo el link de boorstrap-->>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!--Lo que va a hacer el bg de la clase es primero mantener el fondo gris, segundo
va a centrar todo el formulario-->>
<body class="bg-secondary d-flex justify-content-center align-items-center vh-100">
    <!--Con esto hago un contorno cuadrado para que el texto no se vea completamente gris-->>
   <div class="card p-4 shadow rounded" style="width: 400px;"> 

    <form id="formLogin" action="#">

    <h1>LOGIN</h1>

    <div class="mb-3 mt-3">
        <label for="email" class="form-label">Ingrese su email:</label>
        <input type="email" class="form-control" id="emailLogin" placeholder="Enter email" name="email">
    </div>

    <div class="mb-3">
        <label for="pwd" class="form-label">Password:</label>
        <input type="password" class="form-control" id="pwdLogin" placeholder="Enter password" name="pswd">
    </div>
    

    <div class="form-check mb-3">
        <label class="form-check-label">
        <input class="form-check-input" type="checkbox" name="remember"> Remember me
        </label>
    </div>

    <button type="submit" class="botonCuenta">Submit</button>
    <br>

    <label>No tienes una cuenta, crea una presionando aqui</label>
    <br>
    <label>▾</label>
    <br>
    <div class="mb-3 mt-3">
        <a type="button" class="botonCuenta text-decoration-none" href="CreacionUsuario.html">Crear Cuenta</a>
    </div>

    

    <!--Conecto con el archivo js-->>
    <script src="../JavaScript/validarLogin.js"></script>
</form>
</body>
</html>
