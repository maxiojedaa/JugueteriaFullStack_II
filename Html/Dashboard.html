<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel & Toys - Panel de Administración</title>
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Css/Estilos.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <header class="py-2" style="background-color: #81c8e4;">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-4">
                <ul class="navbar-nav . navbar-link-text-dark d-flex flex-row gap-4">
                    <a href="PaginaPrincipal.html">
                        <img src="../Img/LogoPixelToysII.png" alt="Pixel & Toys" style="height: 45px;">
                    </a>
                    <span class="badge bg-dark fs-6">Panel de Administración</span>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="../Html/PanelAdmin.html">
                            Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="../Html/PanelAdmin.html">
                            Usuarios
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="../Html/PanelAdmin.html">
                            Pedidos
                        </a>
                    </li>
                </ul>
            </div>

            <!--<div class="d-flex align-items-right gap-4">
                
            </div>-->

            <div>
                <a href="PaginaPrincipal.html" class="btn btn-outline-dark btn-sm fw-bold">
                    <i class="bi bi-house-door me-1"></i> Volver a la Tienda
                </a>
            </div>
        </div>
    </header>
    <!-- CONTENIDO PRINCIPAL -->
    <!--<main class="container my-4 flex-grow-1">-->
    <main class="container-fluid px-4 my-4 flex-grow-1">
        <div class="row g-4">

            <!-- MENÚ LATERAL -->
            <div class="col-14 col-lg-2">
                <div class="card border-0 shadow-sm rounded-8 p-3">
                    <h5 style="text-align: center;" class="fw-bold mb-3 text-dark">Productos</h5>

                </div>

            </div>
            <div class="col-14 col-lg-2">
                <div class="card border-0 shadow-sm rounded-8 p-3">
                    <h5 style="text-align: center;" class="fw-bold mb-3 text-dark">Usuarios</h5>

                </div>

            </div>
            <div class="col-14 col-lg-2">
                <div class="card border-0 shadow-sm rounded-8 p-3">
                    <h5 style="text-align: center;" class="fw-bold mb-3 text-dark">Pedidos</h5>

                </div>
            </div>

        </div>  
        <div class="row g-4 mt-4">
            <div class="col-12">
                <div class="card border-0 shadow-sm rounded-8 p-3">
                    <h5 style="text-align: center;" class="fw-bold mb-3 text-dark">Pedidos más Recientes</h5>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>N° Pedido</th>
                                    <th>Usuario</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tablaPedidos">
                                <!-- Las filas se generan con JS -->
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <!-- MODAL: DETALLE DEL PEDIDO -->
    <div class="modal fade" id="modalDetallePedido" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Detalle del pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detallePedidoBody">
                    <!-- Contenido dinámico -->
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-4 mt-auto w-100">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 Pixel & Toys. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/PanelAdmin.js"></script>
    <script src="../JavaScript/Pedidos.js"></script>
</body>

</html>
