<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Juguetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Css/Estilos.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-speedometer2 me-2"></i>Panel de Administración</h2>
            <a href="PaginaPrincipal.html" class="btn btn-outline-dark">Volver a la Tienda</a>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm text-center">
                    <h5>Gestión de Productos</h5>
                    <p class="text-muted small">Agregar, editar o eliminar productos del inventario.</p>
                    <button class="btn btn-primary btn-sm">Administrar Productos</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm text-center">
                    <h5>Usuarios Registrados</h5>
                    <p class="text-muted small">Visualizar la lista de usuarios del sistema.</p>
                    <button class="btn btn-primary btn-sm">Ver Usuarios</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm text-center">
                    <h5>Ventas y Pedidos</h5>
                    <p class="text-muted small">Revisar el historial de compras realizadas.</p>
                    <button class="btn btn-primary btn-sm">Ver Pedidos</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
